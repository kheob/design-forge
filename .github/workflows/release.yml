name: Release

# Publishing is gated on a tag, not a push to main. Merging is cheap and frequent;
# releasing is deliberate and irreversible, so the two need different triggers.
on:
  push:
    tags: ['v*']

jobs:
  # Same typecheck / build / smoke test CI runs on every push, across the supported Node
  # range. A tag must clear the identical bar before anything reaches the registry.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # write, not read — the final step creates the GitHub release.
      contents: write
      # The only credential this workflow uses. npm Trusted Publishing exchanges this
      # short-lived OIDC token for publish rights, so there is no NPM_TOKEN secret to
      # store, leak or rotate. Provenance attestations are generated automatically.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 22.14+ is a hard requirement for trusted publishing. The package itself still
      # supports Node 20 — that floor is exercised by the CI matrix, not here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.x; trusted publishing needs 11.5.1 or later. Pinning the
      # major keeps this from silently regressing if the bundled version changes.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) / node $(node --version)"

      - run: npm ci

      # The failure mode this prevents: tagging v0.2.0 while package.json still says 0.1.0,
      # and publishing the wrong version under a tag that claims otherwise.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            echo "Bump the version, commit, then re-tag."
            exit 1
          fi
          echo "Releasing $PKG"

      # Catches a re-tag of an already-published version before npm rejects it, with a
      # message that says what to do about it.
      - name: Version must be unpublished
        run: |
          PKG="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$PKG" version > /dev/null 2>&1; then
            echo "::error::$NAME@$PKG is already published. Versions cannot be reused."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: authentication is the OIDC token from id-token: write.
      # prepack rebuilds dist/, so the published tarball can never be stale.
      - name: Publish
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
